    body {

    }

    /* TOP BAR */
    .topbar {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(90deg, #2c2c2c 0%, #3a3a3a 100%);

    .topbar a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      opacity: 1;
      transition: opacity 0.2s;
    }
    .topbar a:hover { opacity: 0.75; }
    .topbar-title {
      color: white;
      font-weight: bold;
      font-size: 16px;
      padding: 4px 12px;
      border-radius: 12px;
    }

    /* MAIN */
    .main {

      flex-direction: column;
      gap: 20px;
    }

    .page-title {
      text-align: center;

      font-size: 48px;

      color: #c0392b;
    }
    .page-subtitle {

    /* CARD */
    .card {
      position: relative;

      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border: 1px solid #e5e5e5;
    }

      display: flex;

    }

    .badge-red { background: #fee2e2; color: #c0392b; }

    /* SELECTED DISPLAY */

    .slot {

    .display-label {

    /* ACTION BUTTONS */

    .ball {

    .ball:hover { transform: scale(1.1); }

      background: white;
      border-color: #d1d5db;

    @keyframes slideUp {

  const MAX_REGULAR = 6;
  const TOTAL_NUMBERS = 37;
  const TOTAL_STRONG = 7;

  let selectedRegular = [];
  let selectedStrong = null;
  let savedForms = [];
  
  // ----- BUILD GRIDS -----
  function buildGrid(containerId, count, variant) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      const btn = document.createElement('button');
      btn.className = `ball ball-${variant}`;
      btn.id = `${variant}-${i}`;
      btn.innerHTML = `<div class="ball-shine"></div><span>${i}</span>`;
      btn.onclick = () => toggleBall(i, variant);
      container.appendChild(btn);
    }
  }

  // ----- TOGGLE -----
  function toggleBall(num, variant) {
    if (!requireLogin()) return;
    if (variant === 'regular') {
      if (selectedRegular.includes(num)) {
        selectedRegular = selectedRegular.filter(n => n !== num);
      } else if (selectedRegular.length < MAX_REGULAR) {
        selectedRegular.push(num);
      }
    } else {
      selectedStrong = (selectedStrong === num) ? null : num;
    }
    render();
  }

  // ----- RENDER -----
  function render() {
    // Update ball classes
    for (let i = 1; i <= TOTAL_NUMBERS; i++) {
      const el = document.getElementById(`regular-${i}`);
      if (el) el.classList.toggle('selected', selectedRegular.includes(i));
    }
    for (let i = 1; i <= TOTAL_STRONG; i++) {
      const el = document.getElementById(`strong-${i}`);
      if (el) el.classList.toggle('selected', selectedStrong === i);
    }

    // Badges
    document.getElementById('regularCount').textContent = `${selectedRegular.length}/${MAX_REGULAR}`;
    document.getElementById('strongCount').textContent = `${selectedStrong ? 1 : 0}/1`;

    // Selected display
    const display = document.getElementById('selectedDisplay');
    display.innerHTML = '';

    // Regular slots
    for (let i = 0; i < MAX_REGULAR; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      const num = selectedRegular[i];
      if (num !== undefined) {
        slot.classList.add('filled-red');
        slot.textContent = num;
      } else {
        slot.textContent = '?';
      }
      display.appendChild(slot);
    }

    // Separator
    const sep = document.createElement('div');
    sep.className = 'separator';
    display.appendChild(sep);

    // Strong slot
    const strongSlot = document.createElement('div');
    strongSlot.className = 'slot';
    if (selectedStrong) {
      strongSlot.classList.add('filled-amber');
      strongSlot.textContent = selectedStrong;
    } else {
      strongSlot.classList.add('strong-empty');
      strongSlot.textContent = '★';
    }
    display.appendChild(strongSlot);

    // Submit button
   const isComplete = selectedRegular.length === MAX_REGULAR && selectedStrong !== null;
document.getElementById('submitBtn').disabled = savedForms.length === 0;

    const confirmBtn = document.getElementById('confirmBtn');

if (isComplete) {
  confirmBtn.style.display = 'inline-flex';

confirmBtn.classList.remove('attention');
void confirmBtn.offsetWidth;
confirmBtn.classList.add('attention');

  setTimeout(() => {
    scrollToTopForm();
  }, 100);

} else {
  confirmBtn.style.display = 'none';
}
  }

  // ----- AUTO FILL -----
function autoFill() {
  if (!requireLogin()) return;
  const nums = getRandomNumbers(MAX_REGULAR, TOTAL_NUMBERS);
  const strong = getRandomNumbers(1, TOTAL_STRONG)[0];
  selectedRegular = nums;
  selectedStrong = strong;
  render();
  scrollToTopForm();
}

  function getRandomNumbers(count, max) {
    const set = new Set();
    while (set.size < count) set.add(Math.floor(Math.random() * max) + 1);
    return [...set];
  }

  // ----- CLEAR -----
  function clearAll() {
    selectedRegular = [];
    selectedStrong = null;
    render();
  }


  function getLottoPriceSummary() {
  const tablesCount = savedForms.length;
  const draws = Number(document.getElementById("drawsSelect").value || 1);
  const extra = document.getElementById("extraCheck").checked;

  const tablePrice = 3;
  const extraPricePerDraw = 6;
  const deliveryFee = tablesCount > 0 ? 3 : 0;

  const gameCost = tablesCount * tablePrice * draws;
  const extraCost = extra ? extraPricePerDraw * draws : 0;
  const totalPrice = gameCost + extraCost + deliveryFee;

  return {
    tablesCount,
    draws,
    extra,
    gameCost,
    extraCost,
    deliveryFee,
    totalPrice
  };
}
  // ----- SUBMIT -----
async function submitForm() {
  if (isSubmitting) return;

  isSubmitting = true;

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = "⏳ שולח...";

  if (savedForms.length === 0) {
    showToast("אין טפסים לשליחה. אשר לפחות טופס אחד", "error");

    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.innerHTML = "שלח טופס";
    return;
  }

  if (savedForms.length < 2) {
  showToast("בלוטו חייבים לשלוח לפחות 2 טבלאות", "error");

  isSubmitting = false;
  submitBtn.disabled = false;
  submitBtn.innerHTML = "שלח טופס";
  return;
}

if (savedForms.length > 14) {
  showToast("בלוטו אפשר לשלוח עד 14 טבלאות בלבד", "error");

  isSubmitting = false;
  submitBtn.disabled = false;
  submitBtn.innerHTML = "שלח טופס";
  return;
}

if (savedForms.length % 2 !== 0) {
  showToast("בלוטו חייבים לשלוח מספר זוגי של טבלאות", "error");

  isSubmitting = false;
  submitBtn.disabled = false;
  submitBtn.innerHTML = "שלח טופס";
  return;
}

  const { data } = await supabaseClient.auth.getUser();
  currentUser = data.user;

  if (!currentUser) {
    showLoginModal();

    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.innerHTML = "שלח טופס";
    return;
  }

const price = getLottoPriceSummary();

const lottoOrder = {
  user_id: currentUser.id,
  user_email: currentUser.email,
  user_name: currentUser.user_metadata.full_name || currentUser.email,

  tables: savedForms.map(form => ({
    numbers: form.numbers,
    strong: form.strong
  })),

 tables_count: savedForms.length,

draws: price.draws,
extra: price.extra,

game_cost: price.gameCost,
extra_cost: price.extraCost,
delivery_fee: price.deliveryFee,
amount: price.totalPrice,

status: "pending"
};

const { error } = await supabaseClient
  .from("lotto_forms")
  .insert(lottoOrder);

  if (error) {
    console.error(error);
    showToast("שגיאה בשליחה לסופרבייס", "error");

    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.innerHTML = "שלח טופס";
    return;
  }

  showToast("הטפסים נשלחו וממתינים לאישור", "success");
  submitBtn.innerHTML = "✅ נשלח";

  setTimeout(() => {
    window.location.replace("my-forms.html");
  }, 400);
}

  // ----- TOAST -----
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  function scrollToTopForm() {
  document.querySelector('.selected-display').scrollIntoView({
    behavior: 'smooth',
    block: 'center'
  });
}

function confirmCurrentForm() {

  document.getElementById('confirmBtn')
    .classList.remove('attention');

  if (selectedRegular.length !== MAX_REGULAR || selectedStrong === null) {
    showToast('צריך לבחור 6 מספרים ומספר חזק', 'error');
    return;
  }

 savedForms.push({
  numbers: [...selectedRegular].sort((a, b) => a - b),
  strong: selectedStrong,
  extra: document.getElementById("extraCheck").checked
});

  renderSavedForms();
  clearAll();

  showToast('הטופס אושר ונשמר', 'success');
}


function renderSavedForms() {
  const card = document.getElementById('savedFormsCard');
  const list = document.getElementById('formsList');
  const count = document.getElementById('formsCount');

  card.style.display = 'block';
  count.textContent = savedForms.length;

  document.getElementById('submitBtn').disabled = savedForms.length === 0;

  if (savedForms.length === 0) {
    list.innerHTML = `
      <div class="saved-form empty-list-message">
        הרשימה ריקה<br>
        אנא אשרו טופס אחד לפחות בכפתור הירוק למעלה
      </div>
    `;
    return;
  }

 list.innerHTML = savedForms.map((form, index) => `
  <div class="saved-form">
    <button class="form-delete-btn" onclick="deleteSavedForm(${index})">✕</button>

    <div class="saved-form-content">
      <strong>טבלה ${index + 1}</strong><br>

      מספרים: ${form.numbers.join(', ')}<br>
      חזק: ${form.strong}<br>
      אקסטרה: ${form.extra ? "כן סומן" : "לא סומן"}<br><br>

      עלות טבלה: 3 ₪
    </div>
  </div>
`).join('');

  const price = getLottoPriceSummary();

list.innerHTML += `
  <div class="saved-form" style="
    background:#ecfdf5;
    border:2px solid #16a34a;
    margin-top:12px;
  ">
    <strong>סיכום הזמנה</strong><br>

    טבלאות: ${price.tablesCount}<br>
    מספר הגרלות: ${price.draws === 1 ? "הגרלה אחת הקרובה" : price.draws + " הגרלות"}<br>

    עלות טבלאות: ${price.gameCost} ₪<br>
    עלות אקסטרה: ${price.extraCost} ₪<br>
    עמלת שילוח: ${price.deliveryFee} ₪<br>

    <hr style="margin:8px 0">

    <strong>סה״כ לתשלום: ${price.totalPrice} ₪</strong>
  </div>
`;
}

function deleteSavedForm(index) {
  savedForms.splice(index, 1);
  renderSavedForms();
  showToast('הטופס נמחק מהרשימה', 'success');
}
