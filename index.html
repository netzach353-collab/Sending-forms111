  <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"

window.supabase = createClient(
  "https://ikjgwgkucvfvujuodflf.supabase.co",
  "sb_publishable_Chq48eYxHD3Y-cmbK8JoxA_luOwIJ9y"
);

console.log("Supabase מוכן");
</script>

  <script>
    
async function loginWithGoogle() {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.href,
      queryParams: {
        prompt: "select_account"
      }
    }
  });
}
// =========================
// סרגל צד (היה חסר!)
// =========================
function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

async function confirmLogout() {
  await supabase.auth.signOut();

  currentUser = null;
  closeLogoutModal();
  checkUser();
}


// =========================
// INIT
// =========================


let currentUser = null;

async function checkUser() {
  const { data } = await supabase.auth.getUser();

  currentUser = data.user;

  const topProfile = document.getElementById("topProfile");
  const sideProfile = document.getElementById("sideProfile");

  if (currentUser) {
    const name =
      currentUser.user_metadata.full_name ||
      currentUser.email;

    topProfile.style.display = "block";
    topProfile.textContent = name;

    sideProfile.innerHTML = `
      👤 ${name}
    `;

    sideProfile.onclick = showLogoutModal;

  } else {

    topProfile.style.display = "none";

    sideProfile.innerHTML = `
      <svg width="10" height="10" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.73 1.22 9.24 3.6l6.91-6.91C35.68 2.38 30.2 0 24 0 14.82 0 6.73 5.48 2.69 13.44l8.04 6.24C12.6 13.04 17.86 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.5c0-1.64-.15-3.21-.43-4.73H24v9h12.4c-.54 2.9-2.2 5.36-4.7 7.04l7.26 5.64C43.98 37.5 46.1 31.5 46.1 24.5z"/>
        <path fill="#FBBC05" d="M10.73 28.68a14.5 14.5 0 010-9.36l-8.04-6.24A23.97 23.97 0 000 24c0 3.87.93 7.52 2.69 10.92l8.04-6.24z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.4-2.04 15.2-5.54l-7.26-5.64c-2.02 1.36-4.6 2.18-7.94 2.18-6.14 0-11.4-3.54-13.27-8.68l-8.04 6.24C6.73 42.52 14.82 48 24 48z"/>
      </svg>
      התחבר 
    `;

    sideProfile.onclick = loginWithGoogle;
  }
}

function openMyForms(event) {
  event.preventDefault();

  if (!currentUser) {
    openLoginBanner();
    return;
  }

  window.location.href = "my-forms.html";
}

function openLoginBanner() {
  document.getElementById("loginOverlay").style.display = "flex";
}

function closeLoginBanner() {
  document.getElementById("loginOverlay").style.display = "none";
}

function showLogoutModal() {
  document.getElementById("logoutOverlay").style.display = "flex";
}

function closeLogoutModal() {
  document.getElementById("logoutOverlay").style.display = "none";
}

document.addEventListener("DOMContentLoaded", () => {
  checkUser();
});
</script>
